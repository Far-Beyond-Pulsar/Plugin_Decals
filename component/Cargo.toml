[package]
name = "decals_component"
version = "0.1.0"
edition = "2024"
description = "Decals (pulsar.decals): the decal component, its rows, image binding and scene rows, and the plugin's Helio feature set"

# The plugin's root crate (`decals_plugin`) links it and submits its
# component class, texture binding, scene rows and render feature.
[lib]
name = "decals_component"

[features]
# `#[derive(SceneStore)]` checks the deriving crate's own `gpu` feature.
default = ["gpu"]
gpu = []

[dependencies]
engine_class_derive = { workspace = true }
pulsar_reflection = { workspace = true, features = ["prims-gpui"] }
gpui-ce = { workspace = true }
pulsar_scenedb = { workspace = true }
pulsar_scenedb_derive = { workspace = true }
pulsar_world_registry = { workspace = true }
helio_component = { workspace = true }
# The engine-class derive logs through it.
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
wgpu = { workspace = true }
helio-feature-api = { workspace = true }
helio-scene-join = { workspace = true }
helio-pass-decal = { workspace = true }

[lints]
workspace = true
